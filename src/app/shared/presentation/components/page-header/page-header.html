<header class="page-header">
  <div>
    @if (breadcrumb().length) {
      <p class="breadcrumb">{{ breadcrumb().join(' / ') }}</p>
    }
    <h1>{{ title() }}</h1>
    @if (subtitle()) {
      <p class="subtitle">{{ subtitle() }}</p>
    }
  </div>
  <div class="actions"><ng-content/></div>
</header>
